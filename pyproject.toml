[project]
name = "gityup-py"
version = "1.0.3"
description = "A small utility to update local git projects"
authors = [{ name = "Kevin Williams", email = "kevwil@gmail.com" }]
requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT" }
dependencies = ["typer (>=0.16.0,<0.17.0)"]

[tool.uv]
python-preference = "only-system"
required-version = ">=0.7.16"

[dependency-groups]
dev = [
    "poethepoet>=0.35.0,<0.36",
    "black>=25.1.0,<26",
    "pytest-cov>=6.2.1,<7",
    "ruff>=0.12.0,<0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poe.tasks]
test = "pytest -s -v"
check = ["style", "lint", "format", "test", "cov"]

[tool.poe.tasks.clean]
help = "Remove generated files"
cmd = """
    # multiline commands including comments work too!
    rm -rf .pytest_cache
           .ruff_cache
           ./**/__pycache__
           dist
           .coverage
  """

[tool.poe.tasks.format]
help = "run formatting tools on the code base"
sequence = ["format-ruff", "format-black"]

[tool.poe.tasks.format-ruff]
help = "run ruff formatter on code base"
cmd = "ruff check . --fix-only"

[tool.poe.tasks.format-black]
help = "run black formatter on the code base"
cmd = "black ."

[tool.poe.tasks.lint]
help = "evaluate ruff rules"
cmd = "ruff check"

[tool.poe.tasks.style]
help = "validate code base using black code style"
cmd = "black . --check --diff --color"

[tool.poe.tasks.cov]
help = "check code coverage using pytest"
cmd = "pytest --cov"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",     # error
    "F",     # pyflakes
    "I",     # isort
    "W",     # warning
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ASYNC", # flake8-async
    "C4",    # flake8-comprehensions
    "T10",   # flake8-debugger
    "G",     # flake8-logging-format
    "PIE",   # flake8-pie
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "PTH",   # flake8-use-pathlib
    "PGH",   # pygrep-hooks
    "PERF",  # perflint
    "RUF",   # ruff-specific rules
]
ignore = [
    "C408",   # unnecessary-collection-call
    "PT015",  # pytest-assert-always-false
    "SIM118", # in-dict-keys
    "PTH109", # os-getcwd
    "PTH123", # builtin-open
    "RUF012", # mutable-class-default
]
fixable = ["E", "F", "I"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 120
skip-string-normalization = true
target-version = ["py313"]
